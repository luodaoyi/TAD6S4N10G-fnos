name: Build tank (Debian TUI)

on:
  push:
    branches: [main]
    paths: ["debian-tui/**"]
  pull_request:
    paths: ["debian-tui/**"]
  # Tag releases publish all assets atomically from build-release.yml.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build tank (linux/amd64, static)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o tank-linux-amd64 ./debian-tui/tank.go
          file tank-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tank-linux-amd64
          path: tank-linux-amd64

