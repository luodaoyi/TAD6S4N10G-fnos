name: Build TAD6S4N模块 plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate UTF-8 encoding
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/test-encoding.py
          python3 scripts/check-encoding.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' manifest | head -1 | tr -d '"')"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi

      - name: Test
        run: |
          go test ./...
          go vet ./...
          node --check app/ui/static/app.js
          node --test app/ui/static/app.test.js
          node --check app/ui/static/crps/app.js
          node --test app/ui/static/crps/app.test.js
          for script in cmd/* scripts/build.sh scripts/build-spk.sh; do bash -n "$script"; done
          for script in synology/scripts/*; do sh -n "$script"; done
          python3 scripts/test-synology.py

      - name: Download official fnpack
        run: |
          mkdir -p tools
          curl --fail --location --silent --show-error \
            --output tools/fnpack \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod 0755 tools/fnpack scripts/build.sh cmd/*
          tools/fnpack --help | head -5

      - name: Build FPK
        run: FNPACK="${PWD}/tools/fnpack" bash scripts/build.sh

      - name: Verify package
        run: |
          test -s tad-module.fpk
          tar -tf tad-module.fpk | grep -Fx manifest
          tar -tf tad-module.fpk | grep -Fx app.tgz
          tar -tf tad-module.fpk | grep -Fx cmd/main
          tar -tf tad-module.fpk | grep -Fx cmd/it87_dkms.sh
          tar -xOf tad-module.fpk app.tgz | tar -tz | grep -E '(^|/)it87-src/dkms\.conf$'
          tar -xOf tad-module.fpk app.tgz | tar -tz | grep -E '(^|/)it87-src/it87\.c$'
          sha256sum tad-module.fpk > tad-module.fpk.sha256

      - name: Build SPK (Synology DSM)
        run: |
          VERSION="$(sed -n 's/^version=//p' manifest | head -1 | tr -d '"')"
          TAD_SPK_VERSION="${VERSION}" bash scripts/build-spk.sh
          test -s "tad-module-v${VERSION}.spk"
          test -s "tad-module-v${VERSION}.spk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tad-module-${{ github.run_id }}
          path: |
            tad-module.fpk
            tad-module.fpk.sha256
            tad-module-v*.spk
            tad-module-v*.spk.sha256
          if-no-files-found: error

      # Build tank without write permission; the tag-only release job publishes
      # all assets together instead of chaining another release listener.
      - name: Build tank (linux/amd64, static)
        if: github.ref_type == 'tag'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o tank-linux-amd64 ./debian-tui/tank.go
          test -s tank-linux-amd64

      - name: Upload tank artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: tank-${{ github.run_id }}
          path: tank-linux-amd64
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only data from this successful tag build crosses into the write job.
      # No checkout, source scripts, compiled binaries, or cache restore here.
      - name: Download packages from this run
        uses: actions/download-artifact@v4
        with:
          name: tad-module-${{ github.run_id }}
          path: dist

      - name: Download tank from this run
        uses: actions/download-artifact@v4
        with:
          name: tank-${{ github.run_id }}
          path: dist

      - name: Verify release assets
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]] || exit 1
          SPK_NAME="tad-module-${GITHUB_REF_NAME}.spk"
          for asset in tad-module.fpk tad-module.fpk.sha256 "${SPK_NAME}" "${SPK_NAME}.sha256" tank-linux-amd64; do
            if [[ ! -f "${asset}" || -L "${asset}" || ! -s "${asset}" ]]; then
              echo "Missing, empty, or symbolic-link release asset: ${asset}" >&2
              exit 1
            fi
          done
          sha256sum -c tad-module.fpk.sha256
          sha256sum -c "${SPK_NAME}.sha256"

      - name: Publish GitHub Release
        working-directory: dist
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SPK_NAME="tad-module-${GITHUB_REF_NAME}.spk"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Preserve an existing prerelease until its assets have been verified.
            # Never replace existing assets silently.
            gh release upload "${GITHUB_REF_NAME}" \
              tad-module.fpk tad-module.fpk.sha256 \
              "${SPK_NAME}" "${SPK_NAME}.sha256" \
              tank-linux-amd64
          else
            gh release create "${GITHUB_REF_NAME}" \
              tad-module.fpk tad-module.fpk.sha256 \
              "${SPK_NAME}" "${SPK_NAME}.sha256" \
              tank-linux-amd64 \
              --title "TAD6S4N模块 ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
